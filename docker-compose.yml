version: '3.8'

networks:
  ewl_network:
    driver: bridge

services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYSPARK_PYTHON=/opt/spark/venv/bin/python
      - PYSPARK_DRIVER_PYTHON=/opt/spark/venv/bin/python
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - '8080:8080'
    volumes:
      - ./app:/app
      - visualisations-volume:/app/visualisations

    networks:
      - ewl_network

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYSPARK_PYTHON=/opt/spark/venv/bin/python
      - PYSPARK_DRIVER_PYTHON=/opt/spark/venv/bin/python
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    networks:
      - ewl_network
    volumes:
      - ./app:/app

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data
    networks:
      - ewl_network

  # Using a simplified DataHub setup for local development.
  # For a full setup, refer to the official DataHub documentation.
  datahub-gms:
    image: linkedin/datahub-gms:v0.10.5
    container_name: datahub-gms
    ports:
      - "8081:8081"
    environment:
      - DATAHUB_GMS_HOST=datahub-gms
      - DATAHUB_GMS_PORT=8081
      # This is a simplified setup without Kafka/Zookeeper for local dev.
      # For production, you would configure Kafka.
    networks:
      - ewl_network

  # Replacing DataHub frontend with our custom dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ewl-dashboard
    ports:
      - "9002:9002"
    volumes:
      - visualisations-volume:/app/visualisations
    networks:
      - ewl_network
    depends_on:
      - spark-master

volumes:
  visualisations-volume: